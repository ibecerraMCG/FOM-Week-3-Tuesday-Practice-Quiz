<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Tuesday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 3 Tuesday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

    <script>
        const quizData = [
    {
        learningObjective: "LO1 (Minor Pathways of Hexose Metabolism): Explain how galactose and fructose feed into the glycolytic pathway and explain the biochemical and potential clinical consequences of genetic defects in galactose and fructose metabolism.",
        question: "A 2-week-old infant is brought to the clinic with vomiting, diarrhea, jaundice, and hepatomegaly shortly after initiating breastfeeding. Lab tests reveal elevated plasma galactose and galactitol. A deficiency in which of the following enzymes is the most likely cause of this infant's condition?",
        options: { 
            A: "Galactokinase", 
            B: "Galactose-1-phosphate uridyltransferase (GALT)", 
            C: "Aldolase B", 
            D: "Fructokinase" 
        },
        correctAnswer: "B",
        rationale: "This presentation is classic for classic galactosemia, an autosomal recessive disorder caused by a deficiency in GALT. This enzyme is crucial for metabolizing galactose-1-phosphate. Its deficiency leads to a toxic buildup of galactose-1-phosphate and galactitol, causing severe liver damage, cataracts, and failure to thrive. Galactokinase deficiency is milder and primarily causes cataracts.",
        source: "'Disorders of galactose metabolism - Classic galactosemia (type 1)... is due to a deficiency of galactose-1-phosphate uridyltransferase (GALT). The symptoms present in the first weeks after birth and manifests by a failure to thrive associated with vomiting and diarrhea. Physical examination will reveal hepatomegaly, yellowing of sclera and skin and cataracts.' (Minor Pathways of Hexose Metabolism, Page 4)"
    },
    {
        learningObjective: "LO1 (Minor Pathways of Hexose Metabolism): Explain how galactose and fructose feed into the glycolytic pathway and explain the biochemical and potential clinical consequences of genetic defects in galactose and fructose metabolism.",
        question: "A 6-month-old infant presents with poor feeding, vomiting, and failure to thrive after the introduction of fruit juices and pureed fruits into his diet. Lab studies show hypoglycemia, hypophosphatemia, and liver dysfunction. Urinalysis is positive for reducing sugars. This infant most likely has a deficiency in which enzyme?",
        options: { 
            A: "Fructokinase", 
            B: "Aldolase B", 
            C: "Galactose-1-phosphate uridyltransferase (GALT)", 
            D: "Aldose reductase" 
        },
        correctAnswer: "B",
        rationale: "This is the classic presentation of hereditary fructose intolerance, caused by a deficiency in aldolase B. This enzyme deficiency leads to a toxic accumulation of fructose-1-phosphate after fructose ingestion. This traps intracellular phosphate, inhibiting glycogenolysis and gluconeogenesis, which results in severe hypoglycemia and liver damage. Essential fructosuria (fructokinase deficiency) is a benign condition.",
        source: "'Disorders of fructose metabolism - hereditary fructose intolerance... is due to mutations in the aldolase B gene. The symptoms usually present in infants with the introduction of fructose-containing foods...' (Minor Pathways of Hexose Metabolism, Page 6)"
    },
    {
        learningObjective: "LO1 (Minor Pathways of Hexose Metabolism): Explain how galactose and fructose feed into the glycolytic pathway and explain the biochemical and potential clinical consequences of genetic defects in galactose and fructose metabolism.",
        question: "A patient with a high-fructose diet develops hypertriglyceridemia. The unregulated metabolism of fructose in the liver contributes to this condition because it bypasses the primary regulatory step of glycolysis. Which enzyme is bypassed?",
        options: { 
            A: "Hexokinase", 
            B: "Phosphofructokinase-1 (PFK-1)", 
            C: "Pyruvate kinase", 
            D: "Glucokinase" 
        },
        correctAnswer: "B",
        rationale: "Fructose is converted to fructose-1-phosphate and then cleaved into glyceraldehyde and DHAP. These triose phosphates enter the glycolytic pathway downstream of phosphofructokinase-1 (PFK-1), which is the major rate-limiting and hormonally regulated step. This bypass allows for an unregulated flux of carbons through glycolysis, providing excess acetyl-CoA for triglyceride synthesis.",
        source: "'...fructose entry into glycolytic pathway bypasses the hormonal regulation and allosteric regulation that is exerted on glycolysis at PFK1. Thus, fructose consumption can feed metabolites into glycolysis in an unregulated fashion...' (Minor Pathways of Hexose Metabolism, Page 5)"
    },
    {
        learningObjective: "LO2 (Minor Pathways of Hexose Metabolism): Explain sorbitol (polyol) pathway and its consequence in diabetic complications.",
        question: "A 65-year-old man with a 20-year history of poorly controlled type 2 diabetes presents with decreased vision and bilateral cataracts. The formation of these cataracts is primarily initiated by the conversion of excess glucose to sorbitol by which of the following enzymes?",
        options: { 
            A: "Sorbitol dehydrogenase", 
            B: "Hexokinase", 
            C: "Aldose reductase", 
            D: "Fructokinase" 
        },
        correctAnswer: "C",
        rationale: "In states of hyperglycemia, the high concentration of glucose allows it to be shunted into the polyol pathway. The first step is the reduction of glucose to sorbitol, a reaction catalyzed by aldose reductase. Sorbitol is osmotically active and its accumulation in the lens, which has low sorbitol dehydrogenase activity, leads to osmotic swelling and cataract formation.",
        source: "'In the first step, the enzyme aldose reductase reduces the aldose sugars (glucose and galactose) to corresponding sugar alcohols (sorbitol and galactitol).' (Minor Pathways of Hexose Metabolism, Page 9)"
    },
    {
        learningObjective: "LO2 (Minor Pathways of Hexose Metabolism): Explain sorbitol (polyol) pathway and its consequence in diabetic complications.",
        question: "A patient with classic galactosemia develops cataracts despite a galactose-free diet. This is possible because the toxic metabolite, galactitol, can still be formed from galactose that is synthesized endogenously. The accumulation of galactitol in the lens causes osmotic damage because, unlike sorbitol, it cannot be further metabolized by which of the following enzymes?",
        options: { 
            A: "Aldose reductase", 
            B: "Galactokinase", 
            C: "Sorbitol dehydrogenase", 
            D: "Galactose-1-phosphate uridyltransferase" 
        },
        correctAnswer: "C",
        rationale: "The polyol pathway has two steps. Aldose reductase converts aldoses (glucose, galactose) to their respective sugar alcohols (sorbitol, galactitol). The second enzyme, sorbitol dehydrogenase, can convert sorbitol to fructose. However, it cannot act on galactitol. Therefore, once formed, galactitol is trapped in cells like those of the lens, leading to severe osmotic damage.",
        source: "'No cell in the human body can metabolize galactitol and it accumulates within the cell and causes osmotic effects as well.' (Minor Pathways of Hexose Metabolism, Page 9) and the pathway diagram on the same page shows sorbitol dehydrogenase acting only on sorbitol."
    },
    {
        learningObjective: "LO2 (Minor Pathways of Hexose Metabolism): Explain sorbitol (polyol) pathway and its consequence in diabetic complications.",
        question: "In a patient with chronic hyperglycemia, increased activity of the polyol pathway in nerve cells is thought to contribute to diabetic neuropathy. Besides osmotic stress from sorbitol accumulation, what other metabolic consequence of this pathway contributes to cellular damage?",
        options: { 
            A: "Increased production of ATP", 
            B: "Depletion of NAD+", 
            C: "Depletion of NADPH", 
            D: "Increased production of fructose" 
        },
        correctAnswer: "C",
        rationale: "The aldose reductase enzyme uses NADPH as a cofactor, converting it to NADP+. In chronic hyperglycemia, the high flux through this pathway consumes significant amounts of NADPH. NADPH is critical for regenerating reduced glutathione, the primary antioxidant in cells. Depletion of NADPH impairs the cell's ability to neutralize reactive oxygen species, leading to increased oxidative stress and cellular damage.",
        source: "'Increased aldose reductase activity lowers the concentration of NADPH and thus also lowers the concentration of reduced glutathione. This in turn may permit the presence of increased amounts of reactive oxygen species (ROS)...' (Minor Pathways of Hexose Metabolism, Page 10)"
    },
    {
        learningObjective: "LO3 (Minor Pathways of Hexose Metabolism): Explain the significance and metabolic products of the pentose phosphate pathway and discuss the biochemical and clinical consequences of a genetic defect in glucose-6-phosphate dehydrogenase (G6PD) deficiency) enzyme in RBCs.",
        question: "A 25-year-old African American man develops acute hemolytic anemia after being treated with a sulfa drug for a urinary tract infection. A blood smear shows red blood cells with Heinz bodies. This clinical picture is most characteristic of a deficiency in which of the following enzymes?",
        options: { 
            A: "Pyruvate kinase", 
            B: "Glucose-6-phosphate dehydrogenase (G6PD)", 
            C: "Transketolase", 
            D: "Glutathione reductase" 
        },
        correctAnswer: "B",
        rationale: "G6PD deficiency is an X-linked disorder common in African American populations. G6PD is the rate-limiting enzyme of the pentose phosphate pathway, the sole source of NADPH in red blood cells. NADPH is required to keep glutathione in a reduced state to protect against oxidative damage. Oxidant drugs, like sulfa drugs, overwhelm this deficient protective mechanism, leading to hemoglobin denaturation (Heinz bodies) and hemolysis.",
        source: "'Mutation that causes an unstable enzyme is more prevalent in African American & Mediterranean population... Reduced activity of G6PD sensitizes RBCs to oxidative stress caused by infection, oxidative drugs... → hemolytic anemia.' (Minor Pathways of Hexose Metabolism, Page 15)"
    },
    {
        learningObjective: "LO3 (Minor Pathways of Hexose Metabolism): Explain the significance and metabolic products of the pentose phosphate pathway and discuss the biochemical and clinical consequences of a genetic defect in glucose-6-phosphate dehydrogenase (G6PD) deficiency) enzyme in RBCs.",
        question: "The pentose phosphate pathway (PPP) has two main products that are crucial for cellular metabolism. In a rapidly dividing cell, such as in a cancerous tumor, which product of the PPP is primarily used for the synthesis of nucleotides?",
        options: { 
            A: "NADPH", 
            B: "Fructose-6-phosphate", 
            C: "Glyceraldehyde-3-phosphate", 
            D: "Ribose-5-phosphate" 
        },
        correctAnswer: "D",
        rationale: "The pentose phosphate pathway produces both NADPH (for reductive biosynthesis and antioxidant defense) and ribose-5-phosphate. Ribose-5-phosphate is the direct precursor for the synthesis of purine and pyrimidine nucleotides, which are the building blocks of DNA and RNA. Therefore, highly proliferative tissues have a high demand for this product.",
        source: "'Ribose-5-phosphate – substrate for nucleotide synthesis – proliferative tissues.' (Minor Pathways of Hexose Metabolism, Page 13)"
    },
    {
        learningObjective: "LO3 (Minor Pathways of Hexose Metabolism): Explain the significance and metabolic products of the pentose phosphate pathway and discuss the biochemical and clinical consequences of a genetic defect in glucose-6-phosphate dehydrogenase (G6PD) deficiency) enzyme in RBCs.",
        question: "A physician suspects a patient has a thiamine (vitamin B1) deficiency. To confirm the diagnosis, the activity of which of the following enzymes would be measured in the patient's red blood cells?",
        options: { 
            A: "Glucose-6-phosphate dehydrogenase", 
            B: "Pyruvate dehydrogenase", 
            C: "Transketolase", 
            D: "Alpha-ketoglutarate dehydrogenase" 
        },
        correctAnswer: "C",
        rationale: "Transketolase is an enzyme in the non-oxidative branch of the pentose phosphate pathway that requires thiamine pyrophosphate (TPP), the active form of vitamin B1, as a cofactor. Because it is present in red blood cells (which are easily accessible) and is cytosolic, its activity is a reliable and standard clinical measure of a patient's thiamine status.",
        source: "'Transketolase, a thiamine-dependent enzyme – activity measured to determine thiamine status in the body.' (Minor Pathways of Hexose Metabolism, Page 11)"
    },
    {
        learningObjective: "LO4 (Minor Pathways of Hexose Metabolism): List the main sources of reactive oxygen species, explain the phenomenon and significance of respiratory burst, and describe the cellular mechanisms that protect the cell from the potential damage induced by reactive oxygen species.",
        question: "A 5-year-old boy presents with a history of recurrent, severe infections with catalase-positive organisms like Staphylococcus aureus. His neutrophils fail to produce a respiratory burst upon stimulation. This condition, chronic granulomatous disease (CGD), is most commonly caused by a genetic defect in which enzyme complex?",
        options: { 
            A: "Myeloperoxidase", 
            B: "Superoxide dismutase", 
            C: "NADPH oxidase", 
            D: "Glutathione peroxidase" 
        },
        correctAnswer: "C",
        rationale: "The respiratory burst in phagocytes is initiated by the NADPH oxidase complex, which transfers an electron from NADPH to molecular oxygen to form the superoxide radical. This is the first and essential step in producing the reactive oxygen species (ROS) needed to kill ingested pathogens. A defect in this complex leads to CGD, characterized by an inability to fight off certain infections.",
        source: "'Chronic granulomatous disease (CGD) – defect in NADPH oxidase, severe recurrent bacterial and fungal infections, ~75% of CGD cases are X-linked.' (Minor Pathways of Hexose Metabolism, Page 19)"
    },
    {
        learningObjective: "LO4 (Minor Pathways of Hexose Metabolism): List the main sources of reactive oxygen species, explain the phenomenon and significance of respiratory burst, and describe the cellular mechanisms that protect the cell from the potential damage induced by reactive oxygen species.",
        question: "During phagocytosis, neutrophils generate superoxide (O2•−), which is then converted to hydrogen peroxide (H2O2). The enzyme myeloperoxidase then uses H2O2 and chloride ions (Cl−) to produce a potent microbicidal agent, which is the active ingredient in household bleach. What is this agent?",
        options: { 
            A: "Hydroxyl radical (•OH)", 
            B: "Hypochlorous acid (HOCl)", 
            C: "Peroxynitrite (ONOO−)", 
            D: "Ozone (O3)" 
        },
        correctAnswer: "B",
        rationale: "Myeloperoxidase is a key enzyme in the phagosome that catalyzes the reaction between hydrogen peroxide and chloride ions to form hypochlorous acid (HOCl). HOCl is a powerful oxidizing and chlorinating agent that is highly effective at killing bacteria and other pathogens.",
        source: "'H2O2 + 2Cl- --[Myeloperoxidase]--> 2HOCl Hypochlorous acid.' (Minor Pathways of Hexose Metabolism, Page 18)"
    },
    {
        learningObjective: "LO4 (Minor Pathways of Hexose Metabolism): List the main sources of reactive oxygen species, explain the phenomenon and significance of respiratory burst, and describe the cellular mechanisms that protect the cell from the potential damage induced by reactive oxygen species.",
        question: "A cell is exposed to high levels of oxidative stress, leading to the formation of organic hydroperoxides (ROOH) that can damage cellular lipids. The detoxification of these compounds is catalyzed by glutathione peroxidase, an enzyme that requires which of the following elements as an essential cofactor?",
        options: { 
            A: "Iron", 
            B: "Zinc", 
            C: "Copper", 
            D: "Selenium" 
        },
        correctAnswer: "D",
        rationale: "Glutathione peroxidase is a selenoenzyme, meaning it contains selenium in the form of the amino acid selenocysteine at its active site. This cofactor is essential for the enzyme's function in reducing hydrogen peroxide and organic hydroperoxides, thereby protecting the cell from oxidative damage.",
        source: "'Glutathione peroxidase: ... Enzyme containing four selenium atoms (as selenocysteine); catalyzes the breakdown of H2O2 and organic hydroperoxides.' (Minor Pathways of Hexose Metabolism, Page 22)"
    },
    {
        learningObjective: "LO1 (Disorders of Lipid Metabolism): Highlight the key enzymes/events in cellular fatty acid metabolism (oxidation and biosynthesis).",
        question: "A medical student is studying fatty acid synthesis in a liver cell culture under well-fed conditions with high insulin levels. The conversion of acetyl-CoA to malonyl-CoA is identified as the rate-limiting step. Which enzyme catalyzes this reaction?",
        options: { 
            A: "Fatty acid synthase", 
            B: "ATP citrate lyase", 
            C: "Acetyl-CoA carboxylase (ACC)", 
            D: "Carnitine palmitoyltransferase I (CPT-I)" 
        },
        correctAnswer: "C",
        rationale: "Acetyl-CoA carboxylase (ACC) catalyzes the carboxylation of acetyl-CoA to malonyl-CoA. This is the first committed and rate-limiting step of fatty acid biosynthesis. The activity of ACC is tightly regulated by hormones (activated by insulin-mediated dephosphorylation) and allosteric effectors (activated by citrate).",
        source: "'How: Major steps: (2) acetyl CoA carboxylase (ACC) = acetyl CoA → malonyl CoA'. The diagram also labels this as the 'Rate limiting step in FA biosynthesis'. (Disorders of Lipid Metabolism, Page 5)"
    },
    {
        learningObjective: "LO1 (Disorders of Lipid Metabolism): Highlight the key enzymes/events in cellular fatty acid metabolism (oxidation and biosynthesis).",
        question: "During a period of prolonged fasting, a patient's adipose tissue releases free fatty acids into the bloodstream. Before these fatty acids can be oxidized in the mitochondria of other tissues, they must first be activated in the cytoplasm. This activation step involves the attachment of coenzyme A, a reaction catalyzed by which enzyme?",
        options: { 
            A: "Lipoprotein lipase", 
            B: "Hormone-sensitive lipase", 
            C: "Acyl-CoA synthetase", 
            D: "Acetyl-CoA carboxylase" 
        },
        correctAnswer: "C",
        rationale: "Free fatty acids must be converted to their active form, fatty acyl-CoA, before they can be metabolized. This reaction is catalyzed by acyl-CoA synthetase (also called thiokinase) on the outer mitochondrial membrane. The reaction is irreversible due to the subsequent hydrolysis of pyrophosphate (PPi).",
        source: "'Fatty acid activation is the process of converting FFAs into their active form. In the active form they are attached to CoA. This attachment is catalyzed by Acyl CoA synthase or synthetase, a thiokinase enzyme.' (Disorders of Lipid Metabolism, Page 15)"
    },
    {
        learningObjective: "LO1 (Disorders of Lipid Metabolism): Highlight the key enzymes/events in cellular fatty acid metabolism (oxidation and biosynthesis).",
        question: "The transport of long-chain fatty acyl-CoA from the cytosol into the mitochondrial matrix for β-oxidation is a highly regulated process. Which of the following molecules serves as the carrier for the acyl group across the inner mitochondrial membrane?",
        options: { 
            A: "Citrate", 
            B: "Malate", 
            C: "Carnitine", 
            D: "Albumin" 
        },
        correctAnswer: "C",
        rationale: "Long-chain fatty acyl-CoAs cannot cross the inner mitochondrial membrane directly. The acyl group is transferred from CoA to carnitine by carnitine palmitoyltransferase I (CPT-I). The resulting acylcarnitine is then transported across the inner membrane by a translocase. CPT-II on the matrix side then transfers the acyl group back to CoA.",
        source: "'Transport of fatty acids from cytoplasm (outer mito membrane) to Mitochondrial Matrix: The role of carnitine.' (Disorders of Lipid Metabolism, Page 17)"
    },
    {
        learningObjective: "LO2 (Disorders of Lipid Metabolism): Explain how the simultaneous synthesis and oxidation of fatty acids is prevented in the cell.",
        question: "In a hepatocyte during a well-fed state, high levels of insulin promote fatty acid synthesis. A key intermediate in this synthetic pathway also acts as a potent inhibitor of fatty acid oxidation, ensuring the two processes do not occur simultaneously. What is this inhibitory molecule?",
        options: { 
            A: "Acetyl-CoA", 
            B: "Palmitoyl-CoA", 
            C: "Citrate", 
            D: "Malonyl-CoA" 
        },
        correctAnswer: "D",
        rationale: "Malonyl-CoA is the product of the rate-limiting step of fatty acid synthesis (catalyzed by ACC). In addition to being the building block for the growing fatty acid chain, malonyl-CoA allosterically inhibits carnitine palmitoyltransferase I (CPT-I). This inhibition prevents the transport of fatty acids into the mitochondria, thereby blocking β-oxidation while synthesis is active.",
        source: "'Secondary Signals: Malonyl CoA inhibits carnitine acyl transferase-I.' (Disorders of Lipid Metabolism, Page 40)"
    },
    {
        learningObjective: "LO2 (Disorders of Lipid Metabolism): Explain how the simultaneous synthesis and oxidation of fatty acids is prevented in the cell.",
        question: "A patient is in a fasting state, leading to high levels of glucagon. Glucagon signaling in the liver leads to the phosphorylation and inactivation of acetyl-CoA carboxylase (ACC). The primary purpose of inhibiting ACC during fasting is to:",
        options: { 
            A: "Promote the synthesis of ketone bodies.", 
            B: "Increase the rate of glycolysis.", 
            C: "Prevent the inhibition of β-oxidation by removing malonyl-CoA.", 
            D: "Stimulate the export of citrate from the mitochondria." 
        },
        correctAnswer: "C",

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                // Use innerHTML to correctly render any potential HTML tags in questions
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;

                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;

                    const labelText = document.createElement('span');
                    labelText.innerHTML = ` ${optionKey}. ${qData.options[optionKey]}`;
                    
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.addEventListener('click', () => checkAnswer(index));
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');
            const feedbackDiv = questionBlockElement.querySelector('.feedback');

            if (!selectedRadioButton) {
                 feedbackDiv.innerHTML = `<span class="feedback-status">Please select an answer.</span>`;
                 feedbackDiv.className = 'feedback incorrect'; // Use incorrect styling for the alert
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
